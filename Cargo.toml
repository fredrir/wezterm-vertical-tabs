[workspace]
members  = ["crates/vtabs-core", "crates/vtabs-ui", "crates/vtabs-app", "crates/vtabs-store"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
ratatui              = { version = "0.30.2", default-features = false }
tachyonfx            = { version = "0.25.1", default-features = false, features = ["std"] }
unicode-segmentation = "1.12"
unicode-width        = "0.2"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"