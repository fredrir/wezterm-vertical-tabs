[workspace]
members  = ["src/core", "src/ui", "src/app", "src/store", "src/bench", "tools"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
ratatui              = { version = "0.30.2", default-features = false }
tachyonfx            = { version = "0.25.1", default-features = false, features = ["std"] }
unicode-segmentation = "1.12"
unicode-width        = "0.2"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"

[profile.iterate]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = true
lto = "off"

# Tooling: optimized hashing and archiving, incremental rebuilds when tools/ changes.
[profile.xtask]
inherits      = "release"
lto           = "off"
codegen-units = 16
incremental   = true
strip         = "none"
