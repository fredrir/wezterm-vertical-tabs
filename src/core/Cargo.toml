[package]
name              = "vtabs-core"
version.workspace = true
edition.workspace = true
autotests         = false

[features]
schema = ["dep:schemars"]

[dependencies]
serde.workspace      = true
serde_json.workspace = true
schemars             = { workspace = true, optional = true }

[[bin]]
name              = "gen-schema"
required-features = ["schema"]

[[test]]
name = "keybinds"
path = "tests/keybinds.rs"

[[test]]
name = "distros"
path = "tests/distros.rs"
