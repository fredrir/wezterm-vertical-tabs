[project]
name            = "wezterm-vertical-tabs-tests"
version         = "0.1.0"
requires-python = ">=3.12"
dependencies    = []

[dependency-groups]
dev = [
  "filelock>=3.32.5,<4",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-xdist>=3.8.0,<4",
  "ruff>=0.16.6,<0.17",
  "tui-test==0.1.0b3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]
markers = [
  "rust: behavior exercised through a production Rust process",
  "pty: terminal behavior exercised through an isolated PTY",
  "lua: behavior exercised through the public Lua plugin interface",
  "luals: Lua language-server contract validation requiring --run-luals",
  "container: isolated container integration requiring --run-container",
  "native: prebuilt native integration requiring --run-native",
]
