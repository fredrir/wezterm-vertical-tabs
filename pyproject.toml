[project]
name = "vertical-tabs-tui-tests"
version = "0.0.0"
requires-python = "==3.14.7"
dependencies = []

[dependency-groups]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-xdist==3.8.0",
  "ruff==0.16.5",
  "tui-test==0.1.0b2",
]

[tool.uv]
default-groups = ["test"]
package = false

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
markers = [
  "smoke: representative startup, render, and shutdown checks",
  "ssh_mux_e2e: containerized localhost SSH mux-domain tests",
  "tui: black-box tests that exercise wez-vtabs in a real PTY",
  "wezterm_e2e: tests that launch an owned real WezTerm GUI and mux domain",
]
testpaths = ["tests/tui"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
