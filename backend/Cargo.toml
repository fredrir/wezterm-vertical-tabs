[workspace]
resolver = "3"
members = [
  "crates/vtabs-protocol",
  "crates/vtabs-theme",
  "crates/vtabs-core",
  "crates/vtabs-view",
  "crates/vtabs-input",
  "crates/vtabs-runtime",
  "crates/vtabs-zen",
  "crates/wez-vtabs",
]

[workspace.package]
version = "0.1.6"
edition = "2024"

[workspace.dependencies]
vtabs-protocol = { path = "crates/vtabs-protocol" }
vtabs-theme = { path = "crates/vtabs-theme" }
vtabs-core = { path = "crates/vtabs-core" }
vtabs-view = { path = "crates/vtabs-view" }
unicode-width = "0.2"
vtabs-input = { path = "crates/vtabs-input" }
vtabs-runtime = { path = "crates/vtabs-runtime" }
vtabs-zen = { path = "crates/vtabs-zen" }
base64 = "0.23.1"
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
strip         = true
