[workspace]
resolver = "3"
members = [
  "crates/vtabs-protocol",
  "crates/vtabs-engine",
  "crates/vtabs-runtime",
  "crates/vtabs-zen",
  "crates/wez-vtabs",
]

[workspace.package]
version = "0.1.11"
edition = "2024"

[workspace.dependencies]
vtabs-protocol = { path = "crates/vtabs-protocol" }
vtabs-engine = { path = "crates/vtabs-engine" }
unicode-width = "0.2"
vtabs-runtime = { path = "crates/vtabs-runtime" }
vtabs-zen = { path = "crates/vtabs-zen" }
base64 = "0.23.1"
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
libc = "0.2"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.3.18"
unicode-segmentation = "1.12.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
