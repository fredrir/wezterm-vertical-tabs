name: VTabs
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vtabs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - name: Configure cache
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('WEZ_VTABS_CACHE=' + os.path.join(os.environ['RUNNER_TEMP'], 'wez-vtabs') + '\n')
      - name: Resolve upstream main
        shell: python
        run: |
          import os, subprocess
          head = subprocess.check_output(['git', 'ls-remote', 'https://github.com/wezterm/wezterm.git', 'refs/heads/main'], text=True).split()[0]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('WEZ_VTABS_UPSTREAM=' + head + '\n')
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-directories: target/pytest
          cache-on-failure: true
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write('C:\\Strawberry\\perl\\bin\n')
      - name: Install test dependencies
        run: uv sync --locked
      - name: Linux test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y lua5.4 xvfb openbox xdotool imagemagick
      - name: Install Lua Language Server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz -o "$RUNNER_TEMP/luals.tar.gz"
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  $RUNNER_TEMP/luals.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - name: Focused checks
        if: runner.os != 'Linux'
        run: cargo xtask check --timings
      - name: Focused, isolated and language-server checks
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          cargo xtask check --timings -- --run-container --run-luals --basetemp="$RUNNER_TEMP/vtabs-tests"
      - name: Prepare latest main
        run: cargo xtask prepare --timings
      - name: Upstream system dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: cargo xtask deps --timings
      - name: build and package
        run: cargo xtask package --timings
      - name: test diagnostics
        uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with:
          name: gui-test-diagnostics
          path: |
            ${{ runner.temp }}/vtabs-tests/**/*.log
            ${{ runner.temp }}/vtabs-tests/**/report.json
            ${{ runner.temp }}/vtabs-tests/**/result.json
            ${{ runner.temp }}/vtabs-tests/**/samples.jsonl
            ${{ runner.temp }}/vtabs-tests/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: vtabs-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Tooling failure reproduction
        uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: tooling-reproduction-${{ runner.os }}
          path: ${{ env.WEZ_VTABS_CACHE }}/runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
