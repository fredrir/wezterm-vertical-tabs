name: Release
on:
  push:
    tags:
      - "v*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sources match tag
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          grep -qE "^version[[:space:]]*=[[:space:]]*\"$v\"" backend/Cargo.toml \
            || { echo "::error::backend/Cargo.toml is not $v"; exit 1; }
          grep -q "return \"$v\"" plugin/vtabs/version.lua \
            || { echo "::error::plugin/vtabs/version.lua is not $v"; exit 1; }
  build:
    needs: version
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}
          # Tag-scoped caches cannot be reused by the next release tag.
          save-if: false
      - name: Install cross (prebuilt)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --package wez-vtabs --bin wez-vtabs \
              --target ${{ matrix.target }}
          else
            cargo build --release --locked --package wez-vtabs --bin wez-vtabs \
              --target ${{ matrix.target }}
          fi
      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wez-vtabs${{ matrix.ext }} \
             dist/wez-vtabs-${{ matrix.target }}${{ matrix.ext }}
          test -s dist/wez-vtabs-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v7
        with:
          name: wez-vtabs-${{ matrix.target }}
          path: backend/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Assert complete bundle
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin \
                   x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -s "dist/wez-vtabs-$t" || { echo "::error::missing wez-vtabs-$t"; exit 1; }
          done
          test -s dist/wez-vtabs-x86_64-pc-windows-msvc.exe
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
      - name: Assert release profile applied
        run: |
          set -euo pipefail
          f=dist/wez-vtabs-x86_64-unknown-linux-gnu
          if file -b "$f" | grep -q "not stripped"; then
            echo "::error::$f is not stripped; [profile.release] missing"
            exit 1
          fi
          sz=$(stat -c%s "$f")
          max=$((1280 * 1024))
          test "$sz" -le "$max" || { echo "::error::$f is ${sz}B, over 1.25MiB"; exit 1; }
          test "$sz" -gt 102400 || { echo "::error::$f is ${sz}B, suspiciously small"; exit 1; }
      - name: Checksums
        run: cd dist && sha256sum wez-vtabs-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
