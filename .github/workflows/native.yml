name: Native
on:
  push:
    branches: [main, native]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - name: Configure native cache
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('WEZ_VTABS_CACHE=' + os.path.join(os.environ['RUNNER_TEMP'], 'wez-vtabs-native') + '\n')
      - name: Resolve upstream main
        id: upstream
        shell: python
        run: |
          import os, subprocess
          head = subprocess.check_output(['git', 'ls-remote', 'https://github.com/wezterm/wezterm.git', 'refs/heads/main'], text=True).split()[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('head=' + head + '\n')
      - uses: actions/cache@v4
        id: completed
        with:
          path: .native-completed
          key: native-completed-${{ runner.os }}-${{ github.sha }}-${{ steps.upstream.outputs.head }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.completed.outputs.cache-hit != 'true'
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
        if: steps.completed.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.completed.outputs.cache-hit != 'true'
      - name: Windows native dependencies
        if: steps.completed.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write('C:\\Strawberry\\perl\\bin\n')
      - name: Install test dependencies
        if: steps.completed.outputs.cache-hit != 'true'
        run: uv sync --locked
      - name: Linux test dependencies
        if: steps.completed.outputs.cache-hit != 'true' && runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y lua5.4 xvfb openbox xdotool imagemagick
      - name: Install Lua Language Server
        if: steps.completed.outputs.cache-hit != 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz -o "$RUNNER_TEMP/luals.tar.gz"
          echo "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  $RUNNER_TEMP/luals.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - name: Focused checks
        if: steps.completed.outputs.cache-hit != 'true'
        run: uv run --locked python scripts/native.py check
      - name: Prepare latest main
        if: steps.completed.outputs.cache-hit != 'true'
        run: python scripts/native.py prepare
      - name: Upstream system dependencies
        if: steps.completed.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: cd "$WEZ_VTABS_CACHE/worktree" && env CI=yes ./get-deps
      - name: Native build and package
        if: steps.completed.outputs.cache-hit != 'true'
        run: python scripts/native.py package
      - name: Isolated native and SSH mux tests
        if: steps.completed.outputs.cache-hit != 'true' && runner.os == 'Linux'
        shell: bash
        run: >-
          uv run --locked pytest -n 2 tests/integration --run-native --run-container --run-luals --native-bin-dir="$WEZ_VTABS_CACHE/upstream/target/release" --basetemp="$RUNNER_TEMP/vtabs-tests"
      - name: Native test diagnostics
        uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux' && steps.completed.outputs.cache-hit != 'true'
        with:
          name: native-test-diagnostics
          path: |
            ${{ runner.temp }}/vtabs-tests/**/*.log
            ${{ runner.temp }}/vtabs-tests/**/report.json
            ${{ runner.temp }}/vtabs-tests/**/result.json
            ${{ runner.temp }}/vtabs-tests/**/samples.jsonl
            ${{ runner.temp }}/vtabs-tests/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: steps.completed.outputs.cache-hit != 'true'
        with:
          name: native-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Record successful head pair
        if: steps.completed.outputs.cache-hit != 'true'
        shell: python
        run: |
          from pathlib import Path
          Path('.native-completed').write_text('${{ github.sha }} ${{ steps.upstream.outputs.head }}\n')
