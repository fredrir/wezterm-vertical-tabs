name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: protocol mirror matches limits.rs
        run: cargo run -q --locked -p vtabs-protocol --bin gen-lua -- --check
      - name: crate and boundary rules
        run: sh scripts/lint-boundaries.sh && sh scripts/lint-crate-deps.sh
        working-directory: .
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check plugin/init.lua plugin/vtabs plugin/tests
      - run: luarocks install luacheck
      - run: luacheck init.lua vtabs tests
      - run: lua tests/run.lua
      - name: docs table matches the schema
        run: lua scripts/gen-docs.lua --check
        working-directory: .
