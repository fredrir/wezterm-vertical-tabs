name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Build wez-vtabs once for the PTY suite
        run: cargo build --locked --quiet -p wez-vtabs
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          enable-cache: false
      - name: Install locked Python test dependencies
        run: uv sync --locked
        working-directory: .
      - name: Linux PTY suite
        run: WEZ_VTABS_BIN="$GITHUB_WORKSPACE/backend/target/debug/wez-vtabs" uv run --frozen pytest -q -m tui tests/tui
        working-directory: .
      - name: protocol mirror matches limits.rs
        run: cargo run -q --locked -p vtabs-protocol --bin gen-lua -- --check
      - name: config mirror matches the Rust schema
        run: cargo run -q --locked -p vtabs-engine --bin gen-config -- --check
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check plugin/init.lua plugin/vtabs plugin/tests
      - run: luarocks install luacheck
      - run: luacheck init.lua vtabs tests
      - run: lua tests/run.lua
      - name: docs table matches the schema
        run: lua scripts/gen-docs.lua --check
        working-directory: .
  tui-smoke-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          enable-cache: false
      - name: Build wez-vtabs once
        run: cargo build --manifest-path backend/Cargo.toml --locked --quiet -p wez-vtabs
      - name: Install locked Python test dependencies
        run: uv sync --locked
      - name: macOS PTY smoke
        run: WEZ_VTABS_BIN="$GITHUB_WORKSPACE/backend/target/debug/wez-vtabs" uv run --frozen pytest -q -m "tui and smoke" tests/tui
