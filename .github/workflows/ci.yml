name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: protocol mirror matches limits.rs
        run: cargo run -q -p vtabs-protocol --bin gen-lua -- --check
      - name: crate and boundary rules
        run: sh scripts/lint-boundaries.sh && sh scripts/lint-crate-deps.sh
        working-directory: .
      - name: golden frames match plugin/tests/golden/frames
        run: sh scripts/check-frames.sh
        working-directory: .
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check plugin/init.lua plugin/vtabs plugin/tests
      - run: luarocks install luacheck
      - run: luacheck init.lua vtabs tests
      - run: lua tests/run.lua
      - name: docs table matches the schema
        run: lua scripts/gen-docs.lua --check
        working-directory: .
        working-directory: .

